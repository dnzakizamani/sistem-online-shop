name: CI / Automated Testing

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: azatech_order_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client & Migrate
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:admin@localhost:5432/azatech_order_db?schema=public"
        run: |
          npx prisma db push
          npm run prisma:seed

      - name: Run Vitest Automated Tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:admin@localhost:5432/azatech_order_db?schema=public"
          JWT_SECRET: "super-secret-azatech-jwt-key-2026"
        run: npm run test

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
        run: npm run build
